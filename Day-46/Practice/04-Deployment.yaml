apiVersion: apps/v1
kind: Deployment

metadata:
  name: calculator-app-deployment
  labels:
    app: calculator-app

spec:
  replicas: 3

  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app: calculator-app

  template:
    metadata:
      labels:
        app: calculator-app

    spec:
      containers:
        - name: calculator-app
          image: reachfive/fake-api-server:0.1.1
          ports:
            - containerPort: 1090
          envFrom:
            - configMapRef:
                name: calculator-app-configmap

---
apiVersion: v1
kind: Service

metadata:
  name: calculator-app-service
  labels:
    app: calculator-app

spec:
  type: NodePort

  selector:
    app: calculator-app

  ports:
    - protocol: TCP
      port: 80
      targetPort: 1090
      nodePort: 30080