[project]
name = "requirement-agent"
version = "0.1.0"
description = "Multi-agent pipeline to analyze client requirements and send formatted Gmail reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.4.0",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
]

[project.scripts]
requirement-agent = "requirement_agent.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/requirement_agent"]

[tool.uv]
package = true
