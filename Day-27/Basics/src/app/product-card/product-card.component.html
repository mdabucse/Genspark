<div class="card">

  <img
    [src]="product.thumbnail"
    [alt]="product.title"
    class="product-image">

  <div class="card-body">

    <h2>{{ product.title }}</h2>

    <p class="price">
      ₹{{ product.price }}
    </p>

    <p class="description">
      {{ product.description }}
    </p>

    <button class="btn">
      Buy Now
    </button>

  </div>

</div>
