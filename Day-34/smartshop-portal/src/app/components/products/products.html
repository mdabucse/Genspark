<h2>Products</h2>

<div *ngIf="errorMessage()" class="error">
  {{ errorMessage() }}
</div>

<div *ngIf="!errorMessage() && isLoading()">
  Loading products...
</div>

<div *ngIf="!errorMessage() && !isLoading() && products().length === 0">
  No products were returned.
</div>

<ul class="list">

  <li class="tile" *ngFor="let product of products()">

    <img class="tile-leading" [src]="product.thumbnail" [alt]="product.title">

    <div class="tile-content">
      <div class="tile-title">{{ product.title }}</div>
      <div class="tile-subtitle">
        ₹{{ product.price }} &middot; Rating: {{ product.rating }}
      </div>
    </div>

    <button class="tile-trailing" (click)="viewDetails(product.id)">
      View
    </button>

  </li>

</ul>
