<h2>My Profile</h2>

<div *ngIf="!user()">
  Loading profile...
</div>

<div *ngIf="user() as u" class="profile-card">

  <img *ngIf="u.image" [src]="u.image" [alt]="u.firstName" width="120">

  <h3>{{ u.firstName }} {{ u.lastName }}</h3>

  <p><strong>Username:</strong> {{ u.username }}</p>
  <p><strong>Email:</strong> {{ u.email }}</p>
  <p><strong>Gender:</strong> {{ u.gender }}</p>

  <hr>

  <button (click)="goBack()">Back to dashboard</button>

</div>
